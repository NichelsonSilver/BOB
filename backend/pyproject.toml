[project]
name = "bob"
version = "0.1.0"
description = "BOB — Asistente de decisión para trading intradía (Binance perps)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "websockets>=13.0",
    "httpx>=0.27",
    "loguru>=0.7",
    "numpy>=2.0",
    "apscheduler>=3.10",
    # Fase 3 agrega: hmmlearn (HMM gaussiano) + scikit-learn (calibración isotónica)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
]
linux = [
    "uvloop>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bob"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
